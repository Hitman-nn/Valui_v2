# ===== Event TTL cleanup =====
# Сколько хранить событие в кэше контроллера.
event.ttl.duration=30d

# --- Расписание: выбери ОДИН из двух режимов ---

# Режим 1 (fixed-rate, по умолчанию): как часто запускать чистку + задержка перед первым запуском.
event.ttl.cleanup-period=7d
event.ttl.initial-delay=5m

# Режим 2 (weekly): конкретный день недели + время в указанной таймзоне.
# Если раскомментировать cleanup-day — включится weekly-режим,
# а cleanup-period и initial-delay будут игнорироваться.
# Допустимые значения cleanup-day: MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY.
# cleanup-time — в формате HH:mm (или HH:mm:ss).
# zone — любой IANA tz id (Europe/Moscow, UTC, Asia/Novosibirsk и т.п.),
#        по умолчанию — системная зона JVM.
event.ttl.cleanup-day=TUESDAY
event.ttl.cleanup-time=02:45
event.ttl.zone=Europe/Moscow

# ===== Telegram rate limiter =====
# Сколько сообщений/сек отправлять глобально (лимит TG = 30, берём с запасом).
telegram.rate.global-per-second=25
# Минимальный интервал между сообщениями в один чат (лимит TG = 1 msg/sec).
telegram.rate.per-chat-min-interval=1100ms
