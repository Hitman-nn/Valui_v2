networks:
  valui-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:

services:

  # ── PostgreSQL 16 ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: valui-postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # только localhost
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - valui-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── Redis 7 (AOF persistence) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: valui-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"   # только localhost
    volumes:
      - redis_data:/data
    networks:
      - valui-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Kafka 3.7 (KRaft, no Zookeeper) ──────────────────────────
  # Если приложение тоже в Docker — EXTERNAL listener не нужен,
  # приложение подключается через kafka:9092 внутри valui-network.
  kafka:
    image: apache/kafka:3.7.2
    container_name: valui-kafka
    hostname: kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Без EXTERNAL — приложение подключается изнутри Docker-сети
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_LOG_DIRS: /var/lib/kafka/data   # persistent volume!
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - valui-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  # ── Admin UI (Nginx + React SPA) ─────────────────────────────
  admin-ui:
    build:
      context: ./admin-ui
      dockerfile: Dockerfile
    image: valui-admin-ui:latest
    container_name: valui-admin-ui
    ports:
      - "127.0.0.1:3001:80"   # host-Nginx проксирует снаружи
    extra_hosts:
      - "host.docker.internal:host-gateway"   # даёт доступ к Java-app на хосте
    networks:
      - valui-network
    restart: unless-stopped

  # ── Kafka UI ──────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: valui-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: prod
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "127.0.0.1:8091:8080"    # доступен через SSH-туннель или Nginx с паролем
    networks:
      - valui-network
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ── Spring Boot приложение ────────────────────────────────────
  app:
    image: ghcr.io/bogatyrevdl/valui:latest   # публикуется через GitHub Actions
    container_name: valui-app
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DB:            ${POSTGRES_DB}
      POSTGRES_USER:          ${POSTGRES_USER}
      POSTGRES_PASSWORD:      ${POSTGRES_PASSWORD}
      REDIS_PASSWORD:         ${REDIS_PASSWORD}
      TELEGRAM_BOT_TOKEN:     ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME:  ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-0}
      JWT_SECRET:             ${JWT_SECRET}
      ADMIN_API_KEY:          ${ADMIN_API_KEY}
      BOT_AUTH_SECRET:        ${BOT_AUTH_SECRET}
      BOT_PROXY_ENABLED:      ${BOT_PROXY_ENABLED:-false}
      BOT_PROXY_TYPE:         ${BOT_PROXY_TYPE:-SOCKS5}
      BOT_PROXY_HOST:         ${BOT_PROXY_HOST:-}
      BOT_PROXY_PORT:         ${BOT_PROXY_PORT:-}
      BOT_PROXY_USER:         ${BOT_PROXY_USER:-}
      BOT_PROXY_PASS:         ${BOT_PROXY_PASS:-}
      PROXY_ENABLED:          ${PROXY_ENABLED:-false}
      PROXY_HOST:             ${PROXY_HOST:-}
      PROXY_PORT:             ${PROXY_PORT:-}
      PROXY_USERNAME:         ${PROXY_USERNAME:-}
      PROXY_PASSWORD:         ${PROXY_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"   # Nginx на хосте проксирует снаружи
    networks:
      - valui-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
