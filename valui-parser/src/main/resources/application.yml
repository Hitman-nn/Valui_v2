ws:
  pool:
    url: ${BETBOOM_WS_URL:wss://ru-ws.sporthub.bet:444/api/tree_ws/v1}
    headers:
      Origin: https://betboom.ru
    min-size: 2
    max-size: 6
    connect-timeout: 5s
    initial-buffer: 65536
    ready-timeout: 10s
    backoff-base: 300ms
    backoff-max: 10s
    warmup:
      enabled: true
      min-ready: 2
      timeout: 15s

resilience4j:
  circuitbreaker:
    configs:
      parser-default:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
    instances:
      xbet-cb:
        base-config: parser-default
      fonbet-cb:
        base-config: parser-default
      olimp-cb:
        base-config: parser-default
      betcity-cb:
        base-config: parser-default
      betboom-cb:
        base-config: parser-default
        # WS is slower — give more time before opening
        wait-duration-in-open-state: 60s
        sliding-window-size: 6

  retry:
    instances:
      parser-retry:
        max-attempts: 2
        wait-duration: 1s
        retry-exceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
        ignore-exceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException

  timelimiter:
    instances:
      parser-tl:
        timeout-duration: 20s

# Shared HTTP proxy for parsers that need external network access
parser:
  cache:
    sports-ttl: 1h
    tournaments-ttl: 30m
    matches-ttl: 5m
  proxy:
    enabled: ${PROXY_ENABLED:true}
    host: ${PROXY_HOST:91.147.122.69}
    port: ${PROXY_PORT:4232}
    username: ${PROXY_USERNAME:}
    password: ${PROXY_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,circuitbreakers
  health:
    circuitbreakers:
      enabled: true
