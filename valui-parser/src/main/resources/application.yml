ws:
  pool:
    # Was wss://ru-ws.sporthub.bet:444/... — a real browser handshake captured 24.09 (during the
    # "Access rejected" outage) connected successfully to ru-ws2 on the default WSS port (443,
    # no :444). Unverified whether ru-ws (no digit) / :444 is now retired or just one of several
    # load-balanced mirrors (BetBoom likely runs more than one, same pattern as Fonbet's mirror
    # pool) — this is the one instance we have positive evidence works right now.
    url: ${BETBOOM_WS_URL:wss://ru-ws2.sporthub.bet/api/tree_ws/v1}
    headers:
      Origin: https://betboom.ru
    subprotocol: protobuf
    min-size: 2
    max-size: 6
    connect-timeout: 5s
    initial-buffer: 65536
    ready-timeout: 10s
    backoff-base: 300ms
    # Was 10s — with the failures-reset bug fixed (WsClientBorrowingPool.Slot.connect(), see its
    # onOpen javadoc), backoff now actually escalates during a sustained rejection instead of
    # resetting every attempt. A real incident (24.09, BetBoom's gateway closing every connection
    # with "Access rejected") showed reconnects hammering the endpoint every ~300-500ms non-stop
    # for 5+ hours — 30s gives real breathing room per slot once a rejection is confirmed
    # persistent, without slowing recovery from a genuinely brief blip (early attempts still back
    # off gradually from backoff-base).
    backoff-max: 30s
    warmup:
      enabled: true
      min-ready: 2
      timeout: 15s

resilience4j:
  circuitbreaker:
    configs:
      parser-default:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
    instances:
      xbet-cb:
        base-config: parser-default
        # Tighter window: with 77 controllers in flight, the default 10-call window
        # lets too many tasks burn their 8s budget before CB opens.
        # 6-call window at 40% threshold → opens after 3 failures instead of 5.
        sliding-window-size: 6
        failure-rate-threshold: 40
        # Longer wait: 30s produces a probe cycle every ~30s during outages, generating
        # hundreds of HALF_OPEN→OPEN log entries for multi-hour incidents.
        # 2m reduces log noise while still recovering within 2 minutes of XBET coming back.
        wait-duration-in-open-state: 2m
        # Explicit: base-config inheritance of this flag is unreliable in r4j Spring Boot autoconfiguration.
        # Without it the CB stays OPEN until a manual call arrives (not auto-testing every 2m).
        automatic-transition-from-open-to-half-open-enabled: true
      fonbet-cb:
        base-config: parser-default
        automatic-transition-from-open-to-half-open-enabled: true
      olimp-cb:
        base-config: parser-default
        automatic-transition-from-open-to-half-open-enabled: true
      betcity-cb:
        base-config: parser-default
        automatic-transition-from-open-to-half-open-enabled: true
      betboom-cb:
        base-config: parser-default
        # WS is slower — give more time before opening
        wait-duration-in-open-state: 60s
        sliding-window-size: 6
        automatic-transition-from-open-to-half-open-enabled: true

  retry:
    instances:
      parser-retry:
        max-attempts: 2
        wait-duration: 1s
        retry-exceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
        ignore-exceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException

  timelimiter:
    instances:
      parser-tl:
        timeout-duration: 20s

# Shared HTTP proxy for parsers that need external network access
parser:
  cache:
    sports-ttl: 1h
    tournaments-ttl: 30m
    matches-ttl: 5m
  proxy:
    enabled: ${PROXY_ENABLED:true}
    host: ${PROXY_HOST:91.147.122.69}
    port: ${PROXY_PORT:4232}
    username: ${PROXY_USERNAME:}
    password: ${PROXY_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,circuitbreakers
  health:
    circuitbreakers:
      enabled: true
