bot.welcome=Привет, {0}! Добро пожаловать в Valui.\n\nДоступные команды:\n/list — список активных контроллеров\n/listfilter — список фильтров\n/stop — остановить все контроллеры\n/deleteall — удалить все контроллеры\n/help — справка\n/language — выбор языка
