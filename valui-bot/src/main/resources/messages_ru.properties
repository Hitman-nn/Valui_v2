# ─── Bot general ─────────────────────────────────────────────────────────────
bot.welcome=👋 Привет, {0}!\n\nДобро пожаловать в *Valui* — мониторинг букмекерских событий.\n\nВыберите действие из меню ниже 👇
bot.help=Справка по командам Valui:\n\n/menu — главное меню\n/add — добавить контроллер мониторинга\n/list — список активных контроллеров\n/listfilter — список настроенных фильтров\n/stop — остановить все активные контроллеры\n/deleteall — удалить все контроллеры (с подтверждением)\n/info — токены и статистика\n/start — перезапустить бота\n\nПо вопросам поддержки обращайтесь к администратору.
