server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — любой путь отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API-запросов к Java-приложению на хосте.
    # host.docker.internal резолвится в IP хоста через extra_hosts в compose.
    location /api/ {
        proxy_pass         http://host.docker.internal:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Долгий кэш для хэшированных бандлов Vite
    location ~* \.(js|css|woff2?|png|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain application/javascript text/css application/json application/wasm;
}
