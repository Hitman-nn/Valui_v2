# ═══════════════════════════════════════════════════════════════════════════════
# Valui v2.0 — common base configuration
# Profile-specific overrides follow each "---" separator
# ═══════════════════════════════════════════════════════════════════════════════
spring:
  application:
    name: valui

  # Virtual Threads (Tomcat + Spring MVC dispatching)
  threads:
    virtual:
      enabled: true

  # Jackson
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Flyway owns the schema
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

  # DataSource / HikariCP defaults (URL + credentials set per profile)
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ValuiHikariPool
      connection-timeout: 20000      # ms — fail fast if pool exhausted
      idle-timeout: 300000           # ms — 5 min idle eviction
      max-lifetime: 1200000          # ms — 20 min max connection age
      minimum-idle: 2
      auto-commit: false

  # Redis
  data:
    redis:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

  # Kafka
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: valui-notify
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.valui.*"

  # Scheduling
  task:
    scheduling:
      pool:
        size: 4

# Server
server:
  port: 8080
  shutdown: graceful

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# Valui custom config
valui:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:change-me}
    username: ${TELEGRAM_BOT_USERNAME:ValuiBot}
    payment-base-url: ${PAYMENT_BASE_URL:https://pay.valui.com}
  monitor:
    poll-interval-ms: 30000
  admin:
    api-key: ${ADMIN_API_KEY:change-me}
  jwt:
    # HS256 requires >= 32 bytes. Default is DEV-ONLY — set JWT_SECRET in production.
    secret: ${JWT_SECRET:dmFsdWktdjItZGVmYXVsdC1qd3Qtc2VjcmV0LWtleS1mb3ItZGV2LW9ubHk=}
    access-token-ttl-seconds: 3600       # 1 hour
    refresh-token-ttl-seconds: 2592000   # 30 days
  auth:
    # Shared secret between the Telegram bot and this API (set BOT_AUTH_SECRET in production)
    bot-secret: ${BOT_AUTH_SECRET:change-me}

payment:
  gateway: ${PAYMENT_GATEWAY:stub}   # "stub" (default/local) or "yookassa"
  yookassa:
    shop-id: ${YOOKASSA_SHOP_ID:not-configured}
    secret-key: ${YOOKASSA_SECRET_KEY:not-configured}
    api-url: https://api.yookassa.ru/v3

# Logging levels — logback-spring.xml handles appenders and patterns
logging:
  level:
    root: INFO
    com.valui: DEBUG

---
# ═══════════════════════════════════════════════════════════════════════════════
# Profile: local — все сервисы запущены локально (docker-compose up)
# ═══════════════════════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/valui
    username: ${POSTGRES_USER:valui}
    password: ${POSTGRES_PASSWORD:valui_secret}
    hikari:
      maximum-pool-size: 10

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:redis_secret}

  kafka:
    bootstrap-servers: localhost:9092

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

logging:
  level:
    com.valui: DEBUG
    org.springframework.kafka: INFO

---
# ═══════════════════════════════════════════════════════════════════════════════
# Profile: docker — все сервисы в контейнерах (Kubernetes / docker-compose prod)
# ═══════════════════════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://postgres:5432/valui
    username: ${POSTGRES_USER:valui}
    password: ${POSTGRES_PASSWORD:valui}
    hikari:
      maximum-pool-size: 20

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: kafka:9092

logging:
  level:
    com.valui: INFO

---
# ═══════════════════════════════════════════════════════════════════════════════
# Profile: prod — только env vars, никаких дефолтов с паролями
# ═══════════════════════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 30
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      properties:
        security.protocol: SASL_SSL
        sasl.mechanism: PLAIN
        sasl.jaas.config: >
          org.apache.kafka.common.security.plain.PlainLoginModule required
          username="${KAFKA_USERNAME}"
          password="${KAFKA_PASSWORD}";
    consumer:
      properties:
        security.protocol: SASL_SSL
        sasl.mechanism: PLAIN
        sasl.jaas.config: >
          org.apache.kafka.common.security.plain.PlainLoginModule required
          username="${KAFKA_USERNAME}"
          password="${KAFKA_PASSWORD}";

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: WARN
    com.valui: INFO