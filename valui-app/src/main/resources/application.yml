# ═══════════════════════════════════════════════════════════════════════════════
# Valui v2.0 — common base configuration
# Profile-specific overrides follow each "---" separator
# ═══════════════════════════════════════════════════════════════════════════════
spring:
  application:
    name: valui

  # Virtual Threads (Tomcat + Spring MVC dispatching)
  threads:
    virtual:
      enabled: true

  # Jackson
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Flyway owns the schema
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

  # DataSource / HikariCP defaults (URL + credentials set per profile)
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ValuiHikariPool
      connection-timeout: 20000      # ms — fail fast if pool exhausted
      idle-timeout: 300000           # ms — 5 min idle eviction
      max-lifetime: 1200000          # ms — 20 min max connection age
      minimum-idle: 2
      auto-commit: false

  # Redis
  data:
    redis:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

  # Kafka
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        spring.json.add.type.headers: true
    consumer:
      group-id: valui-notify-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "com.valui.*"
        spring.json.use.type.headers: true

  # i18n messages
  messages:
    basename: messages
    encoding: UTF-8
    use-code-as-default-message: false

  # Scheduling
  task:
    scheduling:
      pool:
        size: 4

# ─── Kafka topic & Schema Registry config ────────────────────────────────────
# Separate top-level namespace so KafkaTopicsConfig can bind via @Value without
# polluting spring.kafka.* which is owned by Spring Boot auto-configuration.
kafka:
  # Replication factor: 1 for local/docker (single-node), 3 for prod (see prod profile)
  topics:
    replication-factor: 1
  # Optional Schema Registry. Set SCHEMA_REGISTRY_URL to enable Avro serialization.
  schema-registry:
    url: ${SCHEMA_REGISTRY_URL:}

# Server
server:
  port: 8080
  shutdown: graceful

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

# Valui custom config
valui:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:change-me}
    username: ${TELEGRAM_BOT_USERNAME:ValuiForRelease_bot}
    payment-base-url: ${PAYMENT_BASE_URL:https://pay.valui.com}
    # mode: long_polling (default) | webhook
    mode: ${BOT_MODE:long_polling}
    # Webhook mode only:
    webhook-url: ${BOT_WEBHOOK_URL:}
    secret-token: ${BOT_SECRET_TOKEN:}
    # Proxy for Telegram API (api.telegram.org) — useful when server is behind VPN/firewall
    proxy:
      enabled: ${BOT_PROXY_ENABLED:false}
      type: ${BOT_PROXY_TYPE:SOCKS5}     # HTTP | SOCKS4 | SOCKS5
      host: ${BOT_PROXY_HOST:91.147.122.69}
      port: ${BOT_PROXY_PORT:14232}
      username: ${BOT_PROXY_USER:}
      password: ${BOT_PROXY_PASS:}
    allowed-ips:
      - "149.154.0.0/16"   # Telegram data centers (DC1-DC5)
      - "91.108.0.0/16"    # Telegram MTProto
    wizard:
      sport-page-size: ${BOT_WIZARD_SPORT_PAGE_SIZE:10}
      tournament-page-size: ${BOT_WIZARD_TOURN_PAGE_SIZE:15}
      stale-threshold-days: ${BOT_WIZARD_STALE_DAYS:30}
  monitor:
    poll-interval-ms: 30000         # legacy — kept for reference
    max-concurrent-tasks: 50        # global VT task cap
    max-tasks-per-user: 5           # anti-abuse per-user cap
    default-poll-interval-sec: 60   # fallback when controller.pollIntervalSec is null
  admin:
    api-key: ${ADMIN_API_KEY:change-me}
  jwt:
    # HS256 requires >= 32 bytes. Default is DEV-ONLY — set JWT_SECRET in production.
    secret: ${JWT_SECRET:dmFsdWktdjItZGVmYXVsdC1qd3Qtc2VjcmV0LWtleS1mb3ItZGV2LW9ubHk=}
    access-token-ttl-seconds: 3600       # 1 hour
    refresh-token-ttl-seconds: 2592000   # 30 days
  auth:
    # Shared secret between the Telegram bot and this API (set BOT_AUTH_SECRET in production)
    bot-secret: ${BOT_AUTH_SECRET:change-me}

# Telegram admin notification (used by AdminNotificationService for DLQ alerts)
telegram:
  admin-chat-id: ${TELEGRAM_ADMIN_CHAT_ID:0}

ws:
  pool:
    url: ${BETBOOM_WS_URL:wss://ru-ws.sporthub.bet:444/api/tree_ws/v1}
    headers:
      Origin: https://betboom.ru
    min-size: 2
    max-size: 6
    connect-timeout: 5s
    initial-buffer: 65536
    ready-timeout: 10s
    backoff-base: 300ms
    backoff-max: 10s
    warmup:
      enabled: true
      min-ready: 2
      timeout: 15s

payment:
  gateway: ${PAYMENT_GATEWAY:stub}   # "stub" (default/local) or "yookassa"
  yookassa:
    shop-id: ${YOOKASSA_SHOP_ID:not-configured}
    secret-key: ${YOOKASSA_SECRET_KEY:not-configured}
    api-url: https://api.yookassa.ru/v3

# Logging levels — logback-spring.xml handles appenders and patterns
logging:
  level:
    root: INFO
    com.valui: DEBUG

---
# ═══════════════════════════════════════════════════════════════════════════════
# Profile: local — все сервисы запущены локально (docker-compose up)
# ═══════════════════════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/valui_db
    username: ${POSTGRES_USER:valui}
    password: ${POSTGRES_PASSWORD:valui_secret}
    hikari:
      maximum-pool-size: 10

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:redis_secret}

  kafka:
    bootstrap-servers: localhost:29092

  jpa:
    show-sql: true

kafka:
  schema-registry:
    url: http://localhost:8081

# Telegram proxy — needed when running locally with VPN that blocks api.telegram.org
valui:
  bot:
    proxy:
      enabled: ${BOT_PROXY_ENABLED:true}
      type: ${BOT_PROXY_TYPE:SOCKS5}
      host: ${BOT_PROXY_HOST:91.147.122.69}
      port: ${BOT_PROXY_PORT:14232}
      username: ${BOT_PROXY_USER:}
      password: ${BOT_PROXY_PASS:}

parser:
  proxy:
    enabled: ${PROXY_ENABLED:true}
    host: ${PROXY_HOST:91.147.122.69}
    port: ${PROXY_PORT:4232}
    username: ${PROXY_USERNAME:}
    password: ${PROXY_PASSWORD:}

logging:
  level:
    com.valui: DEBUG
    org.springframework.kafka: INFO

---
# ═══════════════════════════════════════════════════════════════════════════════
# Profile: server-test — приложение запускается локально, инфраструктура на сервере
#
# PostgreSQL и Redis доступны через SSH-туннель:
#   ssh -L 5433:localhost:5433 -L 6380:localhost:6380 user@SERVER_IP
# Kafka доступна напрямую через EXTERNAL listener (порт 29093 открыт в docker-compose.test.yml)
# ═══════════════════════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: server-test

  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:valui_test_db}
    username: ${POSTGRES_USER:valui_test}
    password: ${POSTGRES_PASSWORD:change_me_test_pg}
    hikari:
      maximum-pool-size: 10

  data:
    redis:
      host: localhost
      port: 6380
      password: ${REDIS_PASSWORD:change_me_test_redis}

  kafka:
    bootstrap-servers: ${SERVER_IP}:29093

  jpa:
    show-sql: true

valui:
  bot:
    proxy:
      enabled: ${BOT_PROXY_ENABLED:true}
      type: ${BOT_PROXY_TYPE:SOCKS5}
      host: ${BOT_PROXY_HOST:91.147.122.69}
      port: ${BOT_PROXY_PORT:14232}
      username: ${BOT_PROXY_USER:}
      password: ${BOT_PROXY_PASS:}

parser:
  proxy:
    enabled: ${PROXY_ENABLED:true}
    host: ${PROXY_HOST:91.147.122.69}
    port: ${PROXY_PORT:4232}
    username: ${PROXY_USERNAME:}
    password: ${PROXY_PASSWORD:}

logging:
  level:
    com.valui: DEBUG
    org.springframework.kafka: INFO

---
# ═══════════════════════════════════════════════════════════════════════════════
# Profile: docker — все сервисы в контейнерах (Kubernetes / docker-compose prod)
# ═══════════════════════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:valui_db}
    username: ${POSTGRES_USER:valui}
    password: ${POSTGRES_PASSWORD:valui_secret}
    hikari:
      maximum-pool-size: 20

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:redis_secret}

  kafka:
    bootstrap-servers: kafka:9092

logging:
  level:
    com.valui: INFO

---
# ═══════════════════════════════════════════════════════════════════════════════
# Profile: prod — только env vars, никаких дефолтов с паролями
# ═══════════════════════════════════════════════════════════════════════════════
---
# ═══════════════════════════════════════════════════════════════════════════════
# Profile: prod — приложение запущено на PROD-сервере, инфраструктура в Docker
#
# valui-app запускается НА СЕРВЕРЕ, но НЕ в Docker.
#
# Docker-инфраструктура:
#   PostgreSQL -> 127.0.0.1:5432
#   Redis      -> 127.0.0.1:6379
#   Kafka      -> 127.0.0.1:9094
#
# Важно:
#   - Redis без SSL
#   - Kafka без SASL/SSL
#   - Kafka replication-factor = 1, потому что один broker
# ═══════════════════════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 3
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9094}
    producer:
      properties:
        security.protocol: PLAINTEXT
    consumer:
      properties:
        security.protocol: PLAINTEXT
    admin:
      properties:
        security.protocol: PLAINTEXT

kafka:
  topics:
    replication-factor: 1
  schema-registry:
    url: ${SCHEMA_REGISTRY_URL:}

server:
  port: ${SERVER_PORT:8080}

valui:
  bot:
    proxy:
      enabled: ${BOT_PROXY_ENABLED:false}
      type: ${BOT_PROXY_TYPE:SOCKS5}
      host: ${BOT_PROXY_HOST:}
      port: ${BOT_PROXY_PORT:}
      username: ${BOT_PROXY_USER:}
      password: ${BOT_PROXY_PASS:}

parser:
  proxy:
    enabled: ${PROXY_ENABLED:false}
    host: ${PROXY_HOST:}
    port: ${PROXY_PORT:}
    username: ${PROXY_USERNAME:}
    password: ${PROXY_PASSWORD:}

logging:
  level:
    root: INFO
    com.valui: INFO
    org.springframework.kafka: INFO
