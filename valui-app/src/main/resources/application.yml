# ═══════════════════════════════════════════════════════════════════════════════
# Valui v2.0 — common base configuration
# Profile-specific overrides follow each "---" separator
# ═══════════════════════════════════════════════════════════════════════════════
spring:
  application:
    name: valui

  # Virtual Threads (Tomcat + Spring MVC dispatching)
  threads:
    virtual:
      enabled: true

  # Jackson
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Flyway owns the schema
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

  # DataSource / HikariCP defaults (URL + credentials set per profile)
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ValuiHikariPool
      connection-timeout: 20000      # ms — fail fast if pool exhausted
      idle-timeout: 300000           # ms — 5 min idle eviction
      max-lifetime: 1200000          # ms — 20 min max connection age
      minimum-idle: 2
      auto-commit: false

  # Redis
  data:
    redis:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

  # Kafka
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: valui-notify
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.valui.*"

  # i18n messages
  messages:
    basename: messages
    encoding: UTF-8
    use-code-as-default-message: false

  # Scheduling
  task:
    scheduling:
      pool:
        size: 4

# Server
server:
  port: 8080
  shutdown: graceful

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# Valui custom config
valui:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:5993930941:AAFyV88j6Cj30CRdfvBRgsdg-msLgez6T9M}
    username: ${TELEGRAM_BOT_USERNAME:ValuiForRelease_bot}
    payment-base-url: ${PAYMENT_BASE_URL:https://pay.valui.com}
    # mode: long_polling (default) | webhook
    mode: ${BOT_MODE:long_polling}
    # Webhook mode only:
    webhook-url: ${BOT_WEBHOOK_URL:}
    secret-token: ${BOT_SECRET_TOKEN:}
    # Proxy for Telegram API (api.telegram.org) — useful when server is behind VPN/firewall
    proxy:
      enabled: ${BOT_PROXY_ENABLED:false}
      type: ${BOT_PROXY_TYPE:HTTP}       # HTTP | SOCKS4 | SOCKS5
      host: ${BOT_PROXY_HOST:}
      port: ${BOT_PROXY_PORT:4232}
      username: ${BOT_PROXY_USER:}
      password: ${BOT_PROXY_PASS:}
    allowed-ips:
      - "149.154.0.0/16"   # Telegram data centers (DC1-DC5)
      - "91.108.0.0/16"    # Telegram MTProto
  monitor:
    poll-interval-ms: 30000         # legacy — kept for reference
    max-concurrent-tasks: 50        # global VT task cap
    max-tasks-per-user: 5           # anti-abuse per-user cap
    default-poll-interval-sec: 60   # fallback when controller.pollIntervalSec is null
  admin:
    api-key: ${ADMIN_API_KEY:change-me}
  jwt:
    # HS256 requires >= 32 bytes. Default is DEV-ONLY — set JWT_SECRET in production.
    secret: ${JWT_SECRET:dmFsdWktdjItZGVmYXVsdC1qd3Qtc2VjcmV0LWtleS1mb3ItZGV2LW9ubHk=}
    access-token-ttl-seconds: 3600       # 1 hour
    refresh-token-ttl-seconds: 2592000   # 30 days
  auth:
    # Shared secret between the Telegram bot and this API (set BOT_AUTH_SECRET in production)
    bot-secret: ${BOT_AUTH_SECRET:change-me}

ws:
  pool:
    url: ${BETBOOM_WS_URL:wss://ru-ws.sporthub.bet:444/api/tree_ws/v1}
    headers:
      Origin: https://betboom.ru
    min-size: 2
    max-size: 6
    connect-timeout: 5s
    initial-buffer: 65536
    ready-timeout: 10s
    backoff-base: 300ms
    backoff-max: 10s
    warmup:
      enabled: true
      min-ready: 2
      timeout: 15s

payment:
  gateway: ${PAYMENT_GATEWAY:stub}   # "stub" (default/local) or "yookassa"
  yookassa:
    shop-id: ${YOOKASSA_SHOP_ID:not-configured}
    secret-key: ${YOOKASSA_SECRET_KEY:not-configured}
    api-url: https://api.yookassa.ru/v3

# Logging levels — logback-spring.xml handles appenders and patterns
logging:
  level:
    root: INFO
    com.valui: DEBUG

---
# ═══════════════════════════════════════════════════════════════════════════════
# Profile: local — все сервисы запущены локально (docker-compose up)
# ═══════════════════════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/valui_db
    username: ${POSTGRES_USER:valui}
    password: ${POSTGRES_PASSWORD:valui_secret}
    hikari:
      maximum-pool-size: 10

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:redis_secret}

  kafka:
    bootstrap-servers: localhost:29092

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

# Telegram proxy — needed when running locally with VPN that blocks api.telegram.org
