# ═══════════════════════════════════════════════════════════════════════════════
# Valui v2.0 — common base configuration
# Profile-specific overrides follow each "---" separator
# ═══════════════════════════════════════════════════════════════════════════════
spring:
  application:
    name: valui

  output:
    ansi:
      enabled: always

  # Virtual Threads (Tomcat + Spring MVC dispatching)
  threads:
    virtual:
      enabled: true

  # File upload (migration endpoint uploads up to ~5 MB)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  # Jackson
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Flyway owns the schema
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

  # DataSource / HikariCP defaults (URL + credentials set per profile)
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ValuiHikariPool
      connection-timeout: 20000      # ms — fail fast if pool exhausted
      idle-timeout: 300000           # ms — 5 min idle eviction
      max-lifetime: 1200000          # ms — 20 min max connection age
      minimum-idle: 2
      auto-commit: false

  # Redis
  data:
    redis:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

  # Kafka
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        spring.json.add.type.headers: true
    consumer:
      group-id: valui-notify-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "com.valui.*"
        spring.json.use.type.headers: true

  # i18n messages
  messages:
    basename: messages
    encoding: UTF-8
    use-code-as-default-message: false

  # Scheduling
  task:
    scheduling:
      pool:
        size: 4

# ─── Kafka topic & Schema Registry config ────────────────────────────────────
# Separate top-level namespace so KafkaTopicsConfig can bind via @Value without
# polluting spring.kafka.* which is owned by Spring Boot auto-configuration.
kafka:
  # Replication factor: 1 for local/docker (single-node), 3 for prod (see prod profile)
  topics:
    replication-factor: 1
  # Optional Schema Registry. Set SCHEMA_REGISTRY_URL to enable Avro serialization.
  schema-registry:
    url: ${SCHEMA_REGISTRY_URL:}

# Server
server:
  port: 8080
  shutdown: graceful

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      # 30.09 incident: /actuator/health is reachable from the public internet (confirmed —
      # this is not localhost-only), so show-details stays when-authorized on purpose: it can
      # carry connection strings, file paths and raw error messages per component, not safe to
      # hand to anonymous callers. show-components is a separate, coarser setting — just each
      # component's name + UP/DOWN, no detail payload — safe to expose anonymously and exactly
      # what was missing when investigating that incident: valui-healthcheck.sh (anonymous,
      # outside the JVM) only ever saw the top-level {"status":"DOWN"}, never which subsystem
      # (DB/Redis/Kafka/disk/custom indicator) actually caused it.
      show-components: always
  health:
    kafka:
      enabled: false   # replaced by KafkaBrokerHealthIndicator (adds alert on state change)
  prometheus:
    metrics:
      export:
        enabled: true

# Valui custom config
valui:
  notifications:
    # Title-based dedup TTL: within this window a duplicate event (same match, different
    # bookmaker event ID) will edit the already-sent Telegram message instead of sending
    # a new notification. Set to 0 to disable.
    dedup-ttl-minutes: ${NOTIFICATIONS_DEDUP_TTL_MINUTES:60}

  alerts:
    parser-incidents:
      # Independent on/off switches for the "bookmaker unavailable/recovered" Telegram messages —
      # regular chats (BookmakerIncidentNotifier) vs. the admin circuit-breaker alert
      # (IncidentAlertListener). Off only suppresses the Telegram send; detection itself (CB
      # state, the ⚠️ on the bot's BK keyboard) keeps running either way.
      #
      # users-enabled defaults OFF (deliberate product decision, 2026-08-17 — not a workaround
      # anymore): IncidentAlertListener and BookmakerIncidentNotifier used to dedup through the
      # *same* Redis claim in ParserIncidentStateStore.markOpen/markClosed, which only let ONE of
      # the two win the claim per real-world CB transition — IncidentAlertListener (synchronous,
      # on the CB's own transition thread) always won, so BookmakerIncidentNotifier's user-facing
      # "недоступна" message silently never went out (recovery messages sometimes still slipped
      # through via ParserHealthChecker's slow-poll bypass, producing lone "снова доступна" with no
      # matching "unavailable"). That race is now fixed — each consumer claims through its own key
      # via ParserIncidentStateStore.claimOpen/claimClosed(consumer, ...) — so it's safe to flip
      # this back to true if user-facing incident notifications are wanted again.
      users-enabled: ${PARSER_INCIDENT_ALERTS_USERS_ENABLED:false}
      admin-enabled: ${PARSER_INCIDENT_ALERTS_ADMIN_ENABLED:true}
    # Aggregate "elevated error rate across the whole scheduler" Telegram alert. Off by default —
    # in practice it fires alongside a per-bookmaker CB alert that already pinged admin about the
    # same incident, so the Telegram send added little the WARN log line below didn't already
    # cover. MonitorSummaryLogger keeps logging the same WARN summary every 10m regardless of
    # this flag — only the Telegram push is suppressed.
    monitor-storm-enabled: ${MONITOR_STORM_ALERTS_ENABLED:false}

  digest:
    # Weekly per-chat stats push (ChatDigestScheduler, valui-admin) — off by default since this
    # reaches every group chat with an active controller at once with zero prior production
    # validation. Check GET /api/v1/admin/digest/preview against real data first, then flip on.
    enabled: ${CHAT_DIGEST_ENABLED:false}
    cron: ${CHAT_DIGEST_CRON:0 0 10 * * MON}
    stale-days: ${CHAT_DIGEST_STALE_DAYS:30}
    window-days: ${CHAT_DIGEST_WINDOW_DAYS:7}

  miniapp:
    url: ${MINIAPP_URL:}

  bot:
    token: ${TELEGRAM_BOT_TOKEN:change-me}
    username: ${TELEGRAM_BOT_USERNAME:ValuiForRelease_bot}
    payment-base-url: ${PAYMENT_BASE_URL:https://pay.valui.com}
    # mode: long_polling (default) | webhook
    mode: ${BOT_MODE:long_polling}
    # Webhook mode only:
    webhook-url: ${BOT_WEBHOOK_URL:}
    secret-token: ${BOT_SECRET_TOKEN:}
    # Proxy for Telegram API (api.telegram.org) — useful when server is behind VPN/firewall
    proxy:
      enabled: ${BOT_PROXY_ENABLED:false}
      type: ${BOT_PROXY_TYPE:SOCKS5}     # HTTP | SOCKS4 | SOCKS5
      host: ${BOT_PROXY_HOST:91.147.122.69}
      port: ${BOT_PROXY_PORT:14232}
      username: ${BOT_PROXY_USER:}
      password: ${BOT_PROXY_PASS:}
    allowed-ips:
      - "149.154.0.0/16"   # Telegram data centers (DC1-DC5)
      - "91.108.0.0/16"    # Telegram MTProto
    stale-threshold-days: ${BOT_STALE_THRESHOLD_DAYS:30}
    wizard:
      sport-page-size: ${BOT_WIZARD_SPORT_PAGE_SIZE:15}
      tournament-page-size: ${BOT_WIZARD_TOURN_PAGE_SIZE:40}
  vk:
    enabled: ${VK_ENABLED:false}
    community-token: ${VK_COMMUNITY_TOKEN:}
    group-id: ${VK_GROUP_ID:0}

  monitor:
    # DEAD CONFIG — poll-interval-ms binds to no field on MonitorProperties (no such property
    # exists); max-tasks-per-user binds to a real field but nothing in DrrDispatcher/scheduler
    # ever reads it — per-user fairness comes entirely from DRR weight (default-user-weight
    # below), not a hard per-user cap. Both keys are safe to delete; kept only so a future
    # reader isn't misled into thinking either is live.
    poll-interval-ms: 30000
    max-tasks-per-user: 30
    max-concurrent-tasks: 200        # global VT task cap
    default-poll-interval-sec: 20   # fallback when controller.pollIntervalSec is null
  admin:
    api-key: ${ADMIN_API_KEY:change-me}
  jwt:
    # HS256 requires >= 32 bytes. Default is DEV-ONLY — set JWT_SECRET in production.
    secret: ${JWT_SECRET:dmFsdWktdjItZGVmYXVsdC1qd3Qtc2VjcmV0LWtleS1mb3ItZGV2LW9ubHk=}
    access-token-ttl-seconds: 3600       # 1 hour
    refresh-token-ttl-seconds: 2592000   # 30 days
  auth:
    # Shared secret between the Telegram bot and this API (set BOT_AUTH_SECRET in production)
    bot-secret: ${BOT_AUTH_SECRET:change-me}
    # Password for admin panel web UI login (POST /api/v1/auth/admin/login)
    admin-password: ${ADMIN_UI_PASSWORD:change-me}

# Telegram admin notification (used by AdminNotificationService for DLQ alerts)
telegram:
  admin-chat-id: ${TELEGRAM_ADMIN_CHAT_ID:0}

ws:
  pool:
    # Kill switch for a sustained gateway-side block — set WS_POOL_ENABLED=false to stop every
    # connection attempt outright (not just back off) and give a suspected rate-limit/anti-abuse
    # window on BetBoom's side a genuine quiet period to expire. See WsPoolProperties.enabled.
    enabled: ${WS_POOL_ENABLED:true}
    # Was wss://ru-ws.sporthub.bet:444/... — a real browser handshake captured 24.09 (during an
    # "Access rejected" outage) connected successfully to ru-ws2 on the default WSS port (443, no
    # :444). THIS file, not valui-parser's own application.yml, is the one Spring Boot actually
    # binds ws.pool.* from at runtime (BOOT-INF/classes/ always wins over the nested
    # BOOT-INF/lib/valui-parser-*.jar's own copy for any overlapping key) — an edit made only to
    # valui-parser's copy during that same incident silently had zero effect and cost a wasted
    # deploy before this was noticed. Keep both files' ws.pool in sync until that duplication is
    # cleaned up for real.
    url: ${BETBOOM_WS_URL:wss://ru-ws2.sporthub.bet/api/tree_ws/v1}
    headers:
      Origin: https://betboom.ru
    # Real BetBoom clients negotiate this WS subprotocol (Sec-WebSocket-Protocol: protobuf) and
    # append a per-connection ?uuid=<random> query param (see WsClientBorrowingPool.withUuid()) —
    # a captured real handshake (24.09) showed both present; ours were missing them.
    subprotocol: protobuf
    min-size: 2
    max-size: 6
    connect-timeout: 5s
    initial-buffer: 65536
    ready-timeout: 10s
    backoff-base: 300ms
    backoff-max: 30s
    # Hygiene recycle — BetBoom keeps server-side subscriptions alive on a connection
    # indefinitely, so a slot that lives too long accumulates ever more background push
    # traffic. Reconnecting before that becomes noticeable bounds the worst case. See
    # WsClientBorrowingPool.handleReturn().
    recycle-after-uses: 500
    max-connection-age: 20m
    # Was 15s (Java default) — prod logs (27.09) showed backlog permanently pinned at MAX_INBOX
    # (2000) with steady frame drops all day. See WsPoolProperties.idleDrainInterval javadoc.
    idle-drain-interval: 3s
    warmup:
      enabled: true
      min-ready: 2
      timeout: 15s

payment:
  gateway: ${PAYMENT_GATEWAY:stub}   # "stub" (default/local) or "yookassa"
  yookassa:
    shop-id: ${YOOKASSA_SHOP_ID:not-configured}
    secret-key: ${YOOKASSA_SECRET_KEY:not-configured}
    api-url: https://api.yookassa.ru/v3

cryptobot:
  api-token: ${CRYPTOBOT_API_TOKEN:}
  api-url: ${CRYPTOBOT_API_URL:https://pay.crypt.bot/api}
  invoice-expires-in-seconds: ${CRYPTOBOT_INVOICE_EXPIRES:3600}

parser:
  xbet:
    enabled: ${XBET_PARSER_ENABLED:true}

# Circuit breakers / retry for bookmaker parsers. 02.10: this block used to live only in
# valui-parser's own application.yml, which is never loaded (shadowed by this file on the
# classpath) — so prod ran on Resilience4j defaults: 100-call window, 10 HALF_OPEN trial calls
# (≈30 min of 3-min probes before a recovered bookmaker was polled again), and a default retry
# of 3 attempts on every exception. Must stay in this file.
resilience4j:
  circuitbreaker:
    configs:
      parser-default:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
    instances:
      xbet-cb:
        base-config: parser-default
        # Tighter window: with 77 controllers in flight, the default 10-call window
        # lets too many tasks burn their 8s budget before CB opens.
        # 6-call window at 40% threshold → opens after 3 failures instead of 5.
        sliding-window-size: 6
        failure-rate-threshold: 40
        # Longer wait: 30s produces a probe cycle every ~30s during outages, generating
        # hundreds of HALF_OPEN→OPEN log entries for multi-hour incidents.
        # 2m reduces log noise while still recovering within 2 minutes of XBET coming back.
        wait-duration-in-open-state: 2m
        # Explicit: base-config inheritance of this flag is unreliable in r4j Spring Boot autoconfiguration.
        # Without it the CB stays OPEN until a manual call arrives (not auto-testing every 2m).
        automatic-transition-from-open-to-half-open-enabled: true
      fonbet-cb:
        base-config: parser-default
        automatic-transition-from-open-to-half-open-enabled: true
      olimp-cb:
        base-config: parser-default
        automatic-transition-from-open-to-half-open-enabled: true
        # "Snapshot still loading" (cold start / long refresh) is slowness, not failure — must not
        # open the breaker. Real download failures surface as their own exceptions and do count.
        ignore-exceptions:
          - com.valui.parser.bookmaker.olimp.OlimpParser$OlimpSnapshotLoadingException
      betcity-cb:
        base-config: parser-default
        automatic-transition-from-open-to-half-open-enabled: true
      betboom-cb:
        base-config: parser-default
        # WS is slower — give more time before opening
        wait-duration-in-open-state: 60s
        sliding-window-size: 6
        automatic-transition-from-open-to-half-open-enabled: true

  retry:
    instances:
      parser-retry:
        max-attempts: 2
        wait-duration: 1s
        retry-exceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
        ignore-exceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException

# Logging levels — logback-spring.xml handles appenders and patterns
logging:
  level:
    root: INFO
    com.valui: DEBUG

---
# ═══════════════════════════════════════════════════════════════════════════════
# Profile: local — все сервисы запущены локально (docker-compose up)
# ═══════════════════════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/valui_db
    username: ${POSTGRES_USER:valui}
    password: ${POSTGRES_PASSWORD:valui_secret}
    hikari:
      maximum-pool-size: 10

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:redis_secret}

  kafka:
    bootstrap-servers: localhost:29092

  jpa:
    show-sql: true

kafka:
  schema-registry:
    url: http://localhost:8081

# Telegram proxy — needed when running locally with VPN that blocks api.telegram.org
valui:
  bot:
    proxy:
      enabled: ${BOT_PROXY_ENABLED:true}
      type: ${BOT_PROXY_TYPE:SOCKS5}
      host: ${BOT_PROXY_HOST:91.147.122.69}
      port: ${BOT_PROXY_PORT:14232}
      username: ${BOT_PROXY_USER:}
      password: ${BOT_PROXY_PASS:}

parser:
  proxy:
    enabled: ${PROXY_ENABLED:true}
    host: ${PROXY_HOST:91.147.122.69}
    port: ${PROXY_PORT:4232}
    username: ${PROXY_USERNAME:}
    password: ${PROXY_PASSWORD:}

logging:
  level:
    com.valui: DEBUG
    org.springframework.kafka: INFO

