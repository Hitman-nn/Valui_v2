    com.valui: DEBUG
    org.springframework.kafka: INFO

---
# ═══════════════════════════════════════════════════════════════════════════════
# Profile: docker — все сервисы в контейнерах (Kubernetes / docker-compose prod)
# ═══════════════════════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://postgres:5432/valui
    username: ${POSTGRES_USER:valui}
    password: ${POSTGRES_PASSWORD:valui}
    hikari:
      maximum-pool-size: 20

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: kafka:9092

logging:
  level:
    com.valui: INFO

---
# ═══════════════════════════════════════════════════════════════════════════════
# Profile: prod — только env vars, никаких дефолтов с паролями
# ═══════════════════════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 30
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      properties:
        security.protocol: SASL_SSL
        sasl.mechanism: PLAIN
        sasl.jaas.config: >
          org.apache.kafka.common.security.plain.PlainLoginModule required
          username="${KAFKA_USERNAME}"
          password="${KAFKA_PASSWORD}";
    consumer:
      properties:
        security.protocol: SASL_SSL
        sasl.mechanism: PLAIN
        sasl.jaas.config: >
          org.apache.kafka.common.security.plain.PlainLoginModule required
          username="${KAFKA_USERNAME}"
          password="${KAFKA_PASSWORD}";

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: WARN
    com.valui: INFO
